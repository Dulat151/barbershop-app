<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Барбершоп - Запись онлайн</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        header { background: #1a1a2e; color: white; padding: 30px; text-align: center; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #f8f9fa; border-bottom: 2px solid #e0e0e0; }
        .btn-back { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .booking-form { padding: 40px; }
        .step { display: none; animation: fadeIn 0.5s; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }
        h2 { color: #1a1a2e; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .masters-grid, .services-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .master-card, .service-item { background: #f8f9fa; border-radius: 15px; padding: 20px; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; text-align: center; }
        .master-card:hover, .service-item:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .master-card.selected, .service-item.selected { border-color: #667eea; background: #f0f0ff; }
        .master-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        .service-item { display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .price { color: #e74c3c; font-weight: bold; font-size: 1.2em; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
        .time-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 30px; }
        .time-slot { background: #f8f9fa; padding: 12px; text-align: center; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
        .time-slot.selected { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .logout-btn { background: #e74c3c; padding: 8px 16px; margin: 0; }
        .my-appointments { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 20px; }
        .appointment-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 60vh; padding: 40px; }
        .auth-card { text-align: center; padding: 40px; }
        .auth-card h2 { margin-bottom: 20px; }
        .g_id_signin { display: flex; justify-content: center; margin-top: 20px; }
        @media (max-width: 768px) { .booking-form { padding: 20px; } .masters-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✂️ Барбершоп "Классика"</h1>
            <p>Профессиональная стрижка и уход</p>
        </header>
        
        <div class="nav-bar">
            <button class="btn-back" id="backBtn" style="display: none;"><i class="fas fa-arrow-left"></i> Назад</button>
            <div id="navUserInfo"></div>
        </div>
        
        <div id="mainContent" class="booking-form"></div>
    </div>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        let selectedMaster = null, selectedService = null, selectedDate = null, selectedTime = null;
        let currentUser = null;
        let currentStep = 1;
        
        async function checkAuth() {
            const res = await fetch('/api/auth/check');
            const data = await res.json();
            if (data.isAuthenticated) {
                currentUser = data.user;
                showBookingInterface();
            } else {
                showAuthScreen();
            }
            updateNavBar();
        }
        
        function showAuthScreen() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div style="font-size: 60px;">✂️</div>
                        <h2>Добро пожаловать!</h2>
                        <p style="color: #666; margin-bottom: 30px;">Войдите через Google чтобы продолжить</p>
                        <div id="googleButton"></div>
                    </div>
                </div>
            `;
            
            google.accounts.id.initialize({
                client_id: '615787033029-8scnkebqknccvuvs4blm7r82814eef3m.apps.googleusercontent.com',
                callback: handleGoogleLogin
            });
            
            google.accounts.id.renderButton(
                document.getElementById('googleButton'),
                { type: 'standard', theme: 'outline', size: 'large', text: 'signin_with' }
            );
        }
        
        async function handleGoogleLogin(response) {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                showBookingInterface();
                updateNavBar();
            } else {
                alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
            }
        }
        
        function updateNavBar() {
            const nav = document.getElementById('navUserInfo');
            if (currentUser) {
                nav.innerHTML = `
                    <div class="user-info">
                        <img src="${currentUser.photo || 'https://randomuser.me/api/portraits/lego/1.jpg'}" class="user-avatar">
                        <span>${currentUser.name}</span>
                        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Выйти</button>
                    </div>
                `;
            } else {
                nav.innerHTML = '';
            }
        }
        
        async function logout() {
            await fetch('/api/auth/logout');
            location.reload();
        }
        
        function showBackButton(show) {
            const backBtn = document.getElementById('backBtn');
            backBtn.style.display = show ? 'inline-flex' : 'none';
            if (show) backBtn.onclick = goBack;
        }
        
        function goBack() {
            if (currentStep > 1) {
                currentStep--;
                showStep(currentStep);
                showBackButton(currentStep > 1);
            }
        }
        
        async function showBookingInterface() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="step active" id="step1">
                    <h2><i class="fas fa-tshirt"></i> Шаг 1: Выберите мастера</h2>
                    <div class="masters-grid" id="mastersGrid"></div>
                </div>
                <div class="step" id="step2">
                    <h2><i class="fas fa-cut"></i> Шаг 2: Выберите услугу</h2>
                    <div class="services-list" id="servicesList"></div>
                </div>
                <div class="step" id="step3">
                    <h2><i class="fas fa-calendar"></i> Шаг 3: Выберите дату и время</h2>
                    <input type="date" id="appointmentDate" min="">
                    <div class="time-slots" id="timeSlots"></div>
                </div>
                <div class="step" id="step4">
                    <h2><i class="fas fa-comment"></i> Шаг 4: Пожелания</h2>
                    <form id="bookingForm">
                        <textarea id="notes" placeholder="Дополнительные пожелания..." rows="4"></textarea>
                        <button type="submit"><i class="fas fa-check"></i> Записаться</button>
                    </form>
                </div>
                <div id="myAppointments" class="my-appointments"></div>
            `;
            
            await loadMasters();
            await loadMyAppointments();
            setupBookingHandlers();
            currentStep = 1;
            showBackButton(false);
        }
        
        async function loadMasters() {
            const res = await fetch('/api/masters');
            const masters = await res.json();
            const grid = document.getElementById('mastersGrid');
            grid.innerHTML = masters.map(m => `
                <div class="master-card" data-id="${m.id}">
                    <img src="${m.photo_url || 'https://randomuser.me/api/portraits/men/1.jpg'}">
                    <h3>${m.name}</h3>
                    <p>${m.specialization || 'Универсал'}</p>
                    <p>⭐ ${m.experience || 0} лет</p>
                    <small>🕐 ${m.work_start?.substring(0,5)} - ${m.work_end?.substring(0,5)}</small>
                </div>
            `).join('');
            
            document.querySelectorAll('.master-card').forEach(c => c.onclick = () => selectMaster(c));
        }
        
        function selectMaster(card) {
            document.querySelectorAll('.master-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedMaster = { id: card.dataset.id, name: card.querySelector('h3').innerText };
            currentStep = 2;
            showStep(currentStep);
            showBackButton(true);
            loadServicesForMaster(selectedMaster.id);
        }
        
        async function loadServicesForMaster(masterId) {
            const res = await fetch(`/api/masters/${masterId}/services`);
            const services = await res.json();
            const list = document.getElementById('servicesList');
            if (!services.length) {
                list.innerHTML = '<p>У этого мастера пока нет услуг</p>';
                return;
            }
            list.innerHTML = services.map(s => `
                <div class="service-item" data-id="${s.id}" data-price="${s.price}">
                    <div><strong>${s.name}</strong><br>⏱️ ${s.duration} мин</div>
                    <div class="price">${s.price.toLocaleString()} ₸</div>
                </div>
            `).join('');
            document.querySelectorAll('.service-item').forEach(i => i.onclick = () => selectService(i));
        }
        
        function selectService(item) {
            document.querySelectorAll('.service-item').forEach(s => s.classList.remove('selected'));
            item.classList.add('selected');
            selectedService = { id: item.dataset.id, price: item.dataset.price };
            currentStep = 3;
            showStep(currentStep);
            setupDate();
        }
        
        function setupDate() {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('appointmentDate');
            dateInput.min = today;
            dateInput.value = today;
            dateInput.onchange = (e) => loadTimeSlots(e.target.value);
            loadTimeSlots(today);
        }
        
        async function loadTimeSlots(date) {
            selectedDate = date;
            const res = await fetch(`/api/available-slots/${selectedMaster.id}/${date}`);
            const slots = await res.json();
            const container = document.getElementById('timeSlots');
            if (!slots.length) {
                container.innerHTML = '<p>😞 Нет свободных слотов на этот день</p>';
                return;
            }
            container.innerHTML = slots.map(s => `<div class="time-slot" data-time="${s}">${s.substring(0,5)}</div>`).join('');
            document.querySelectorAll('.time-slot').forEach(s => s.onclick = () => selectTime(s));
        }
        
        function selectTime(slot) {
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            slot.classList.add('selected');
            selectedTime = slot.dataset.time;
            currentStep = 4;
            showStep(currentStep);
        }
        
        function setupBookingHandlers() {
            document.getElementById('bookingForm').onsubmit = async (e) => {
                e.preventDefault();
                const notes = document.getElementById('notes').value;
                const res = await fetch('/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        master_id: selectedMaster.id,
                        master_service_id: selectedService.id,
                        date: selectedDate,
                        time: selectedTime,
                        notes: notes
                    })
                });
                
                if (res.ok) {
                    alert('✅ Запись успешно создана!');
                    location.reload();
                } else {
                    const error = await res.json();
                    alert('❌ ' + error.error);
                }
            };
        }
        
        async function loadMyAppointments() {
            const res = await fetch('/api/my-appointments');
            const appointments = await res.json();
            const container = document.getElementById('myAppointments');
            if (!appointments.length) {
                container.innerHTML = '<h3>📋 Мои записи</h3><p>У вас пока нет записей</p>';
                return;
            }
            
            container.innerHTML = `
                <h3><i class="fas fa-list"></i> Мои записи</h3>
                ${appointments.map(a => `
                    <div class="appointment-item">
                        <div>
                            <strong>📅 ${a.appointment_date} в ${a.appointment_time?.substring(0,5)}</strong><br>
                            💈 Мастер: ${a.master_name}<br>
                            ✂️ Услуга: ${a.service_name || '-'} (${(a.service_price || 0).toLocaleString()} ₸)<br>
                            📍 Статус: ${getStatusText(a.status)}
                        </div>
                    </div>
                `).join('')}
            `;
        }
        
        function getStatusText(status) {
            const statuses = { pending: '⏳ Ожидает', confirmed: '✅ Подтверждена', completed: '✨ Выполнена', cancelled: '❌ Отменена' };
            return statuses[status] || status;
        }
        
        function showStep(step) {
            for(let i=1;i<=4;i++) {
                const el = document.getElementById(`step${i}`);
                if(el) el.classList.toggle('active', i===step);
            }
        }
        
        checkAuth();
    </script>
</body>
</html>
